name: InVisionApp
description: >-
  InVision (InVisionApp, Inc.) was a digital product design collaboration
  platform founded in 2011 by Clark Valberg and Ben Nadel. It built a suite of
  tools for prototyping, design handoff, and real-time collaboration —
  including interactive prototypes, Inspect/Specs for developer handoff, DSM
  (Design System Manager), Boards, and the Freehand online whiteboard. At its
  peak InVision was valued near two billion dollars and backed by Battery
  Ventures, Accel, Tiger Global, and others, serving product design teams as a
  challenger to Adobe. As Figma surged, InVision's business declined: it sold
  the Freehand whiteboard product to Miro in 2023, and wound down all remaining
  services on December 31, 2024, after which customer content was permanently
  deleted. The invisionapp.com domain now redirects to Miro. InVision
  historically exposed a public REST API with OAuth and webhooks for its design
  platform, but that developer surface has been retired along with the product.
